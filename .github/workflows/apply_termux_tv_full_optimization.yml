        shell: bash
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/apply_termux_tv_full_optimization.py
          python3 /tmp/apply_termux_tv_full_optimization.py
          git diff --check

      - name: Push optimization branch
        shell: bash
        run: |
          BRANCH='tv/full-optimization'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add app/src/main/java/com/termux/app/TermuxActivity.java app/src/main/java/com/termux/app/TermuxService.java app/src/main/res/layout/activity_termux.xml app/src/main/res/xml/termux_terminal_view_preferences.xml app/src/main/res/values/strings.xml app/src/main/res/values/tv_memory_profile_arrays.xml app/src/main/res/values-zh-rCN/strings.xml app/src/main/java/com/termux/app/fragments/settings/termux/TerminalViewPreferencesFragment.java termux-shared/src/main/java/com/termux/shared/termux/settings/preferences/TermuxAppSharedPreferences.java termux-shared/src/main/java/com/termux/shared/termux/settings/preferences/TermuxPreferenceConstants.java termux-shared/src/main/res/values-zh-rCN/strings.xml
          git commit -m 'Optimize Termux TV shortcuts, memory profile and Chinese settings'
          git push --force origin "$BRANCH"

      - name: Build debug APKs
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: ./gradlew assembleDebug

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: termux-tv-full-optimization-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Open pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH='tv/full-optimization'
          gh pr view "$BRANCH" --json number >/dev/null 2>&1 || gh pr create --base master --head "$BRANCH" --title 'Termux TV full optimization: shortcuts, memory, Chinese settings' --body 'Adds discoverable TV remote and keyboard shortcuts, adjustable scrollback-memory profiles for new Android TV sessions, and Simplified Chinese settings resources. Built by GitHub Actions.' || echo 'Branch pushed; create the pull request manually if repository policy blocks PR creation.'
