name: Termux TV fix v2 (scroll, memory, Chinese settings)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout first-round working keyboard fix
        uses: actions/checkout@v6
        with:
          ref: tv/hisense-keyboard-fix
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply second-round changes only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def patch(path, old, new):
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              n = data.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}; no commit will be made')
              p.write_text(data.replace(old, new, 1), encoding='utf-8')
              print('patched', path)

          def create(path, content):
              p = Path(path)
              if p.exists():
                  raise SystemExit(f'{path} already exists; refusing to overwrite')
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
              print('created', path)

          # Terminal scrollback callable by the TV remote handler.
          patch('terminal-view/src/main/java/com/termux/view/TerminalView.java',
          '''    /** Overriding {@link View#onGenericMotionEvent(MotionEvent)}. */''',
          '''    /** Scroll the terminal using the same path as touch and mouse-wheel input. */
              public void scrollByRowsFromTvRemote(int rowsDown) {
                  if (mEmulator == null || rowsDown == 0) return;
                  long now = SystemClock.uptimeMillis();
                  MotionEvent event = MotionEvent.obtain(now, now, MotionEvent.ACTION_DOWN, 0f, 0f, 0);
                  try {
                      doScroll(event, rowsDown);
                  } finally {
                      event.recycle();
                  }
              }

              /** Overriding {@link View#onGenericMotionEvent(MotionEvent)}. */''')

          # Intercept the TV remote's D-pad only; preserve real keyboard arrows for shell editing/history.
          client = 'app/src/main/java/com/termux/app/terminal/TermuxTerminalViewClient.java'
          patch(client,
          '''    @SuppressLint("RtlHardcoded")
              @Override
              public boolean onKeyDown(int keyCode, KeyEvent e, TerminalSession currentSession) {
                  if (handleVirtualKeys(keyCode, e, true)) return true;

                  if (isTelevisionDevice() && keyCode == KeyEvent.KEYCODE_DPAD_CENTER) {''',
          '''    private boolean isTvRemoteNavigationEvent(KeyEvent event) {
                  InputDevice device = event.getDevice();
                  return device == null || device.getKeyboardType() != InputDevice.KEYBOARD_TYPE_ALPHABETIC;
              }

              @SuppressLint("RtlHardcoded")
              @Override
              public boolean onKeyDown(int keyCode, KeyEvent e, TerminalSession currentSession) {
                  if (handleVirtualKeys(keyCode, e, true)) return true;

                  if (isTelevisionDevice() && isTvRemoteNavigationEvent(e) &&
                      (keyCode == KeyEvent.KEYCODE_DPAD_UP || keyCode == KeyEvent.KEYCODE_DPAD_DOWN)) {
                      mActivity.getTerminalView().scrollByRowsFromTvRemote(
                          keyCode == KeyEvent.KEYCODE_DPAD_UP ? -3 : 3);
                      return true;
                  }

                  if (isTelevisionDevice() && keyCode == KeyEvent.KEYCODE_DPAD_CENTER) {''')

          # TV shortcut help button in the session drawer.
          activity = 'app/src/main/java/com/termux/app/TermuxActivity.java'
          patch(activity, '''import android.content.IntentFilter;
          import android.content.ServiceConnection;''', '''import android.content.IntentFilter;
          import android.content.ServiceConnection;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;''')
          patch(activity, '''        setToggleKeyboardView();

                  registerForContextMenu(mTerminalView);''', '''        setToggleKeyboardView();
                  setTvShortcutsButtonView();

                  registerForContextMenu(mTerminalView);''')
          patch(activity, '''    private void setToggleKeyboardView() {
                  findViewById(R.id.toggle_keyboard_button).setOnClickListener(v -> {
                      mTermuxTerminalViewClient.onToggleSoftKeyboardRequest();
                      getDrawer().closeDrawers();
                  });

                  findViewById(R.id.toggle_keyboard_button).setOnLongClickListener(v -> {
                      toggleTerminalToolbar();
                      return true;
                  });
              }''', '''    private boolean isTelevisionDeviceForActivity() {
                  int type = getResources().getConfiguration().uiMode & Configuration.UI_MODE_TYPE_MASK;
                  return type == Configuration.UI_MODE_TYPE_TELEVISION ||
                      getPackageManager().hasSystemFeature(PackageManager.FEATURE_LEANBACK);
              }

              private void setTvShortcutsButtonView() {
                  View button = findViewById(R.id.tv_shortcuts_button);
                  if (button == null) return;
                  boolean tv = isTelevisionDeviceForActivity();
                  button.setVisibility(tv ? View.VISIBLE : View.GONE);
                  button.setOnClickListener(v -> new AlertDialog.Builder(TermuxActivity.this)
                      .setTitle(R.string.tv_shortcuts_title)
                      .setMessage(R.string.tv_shortcuts_message)
                      .setPositiveButton(android.R.string.ok, null)
                      .show());
              }

              private void setToggleKeyboardView() {
                  findViewById(R.id.toggle_keyboard_button).setOnClickListener(v -> {
                      mTermuxTerminalViewClient.onToggleSoftKeyboardRequest();
                      getDrawer().closeDrawers();
                  });

                  findViewById(R.id.toggle_keyboard_button).setOnLongClickListener(v -> {
                      toggleTerminalToolbar();
                      return true;
                  });
              }''')
          patch('app/src/main/res/layout/activity_termux.xml', '''                    <com.google.android.material.button.MaterialButton
                                  android:id="@+id/new_session_button"
                                  style="?android:attr/buttonBarButtonStyle"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:text="@string/action_new_session" />
                          </LinearLayout>''', '''                    <com.google.android.material.button.MaterialButton
                                  android:id="@+id/new_session_button"
                                  style="?android:attr/buttonBarButtonStyle"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_weight="1"
                                  android:text="@string/action_new_session" />
                          </LinearLayout>

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal">
                              <com.google.android.material.button.MaterialButton
                                  android:id="@+id/tv_shortcuts_button"
                                  style="?android:attr/buttonBarButtonStyle"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="@string/tv_shortcuts_button"
                                  android:focusable="true"
                                  android:focusableInTouchMode="true" />
                          </LinearLayout>''')

          # A conservative, TV-only scrollback profile controls retained history for new sessions.
          constants = 'termux-shared/src/main/java/com/termux/shared/termux/settings/preferences/TermuxPreferenceConstants.java'
          patch(constants, '''        public static final String KEY_FONTSIZE = "fontsize";


                  /**
                   * Defines the key for current termux terminal session.
                   */
                  public static final String KEY_CURRENT_SESSION = "current_session";''', '''        public static final String KEY_FONTSIZE = "fontsize";

                  /** Scrollback memory profile for Android TV terminal sessions. */
                  public static final String KEY_TV_MEMORY_PROFILE = "tv_memory_profile";
                  public static final String DEFAULT_VALUE_TV_MEMORY_PROFILE = "balanced";


                  /**
                   * Defines the key for current termux terminal session.
                   */
                  public static final String KEY_CURRENT_SESSION = "current_session";''')
          prefs = 'termux-shared/src/main/java/com/termux/shared/termux/settings/preferences/TermuxAppSharedPreferences.java'
          patch(prefs, '''    public void changeFontSize(boolean increase) {
                  int fontSize = getFontSize();

                  fontSize += (increase ? 1 : -1) * 2;
                  fontSize = Math.max(MIN_FONTSIZE, Math.min(fontSize, MAX_FONTSIZE));

                  setFontSize(fontSize);
              }''', '''    public void changeFontSize(boolean increase) {
                  int fontSize = getFontSize();

                  fontSize += (increase ? 1 : -1) * 2;
                  fontSize = Math.max(MIN_FONTSIZE, Math.min(fontSize, MAX_FONTSIZE));

                  setFontSize(fontSize);
              }

              public String getTvMemoryProfile() {
                  String value = mSharedPreferences.getString(
                      TERMUX_APP.KEY_TV_MEMORY_PROFILE, TERMUX_APP.DEFAULT_VALUE_TV_MEMORY_PROFILE);
                  if ("low".equals(value) || "balanced".equals(value) ||
                      "history".equals(value) || "system".equals(value)) return value;
                  return TERMUX_APP.DEFAULT_VALUE_TV_MEMORY_PROFILE;
              }

              public void setTvMemoryProfile(String value) {
                  if (!("low".equals(value) || "balanced".equals(value) ||
                      "history".equals(value) || "system".equals(value))) return;
                  mSharedPreferences.edit().putString(TERMUX_APP.KEY_TV_MEMORY_PROFILE, value).apply();
              }''')
          service = 'app/src/main/java/com/termux/app/TermuxService.java'
          patch(service, '''import android.content.Intent;
          import android.content.res.Resources;''', '''import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.content.res.Resources;''')
          patch(service, '''    @Nullable
              public synchronized TermuxSession createTermuxSession(ExecutionCommand executionCommand) {''', '''    private boolean isTelevisionDevice() {
                  int type = getResources().getConfiguration().uiMode & Configuration.UI_MODE_TYPE_MASK;
                  return type == Configuration.UI_MODE_TYPE_TELEVISION ||
                      getPackageManager().hasSystemFeature(PackageManager.FEATURE_LEANBACK);
              }

              @Nullable
              public synchronized TermuxSession createTermuxSession(ExecutionCommand executionCommand) {''')
          patch(service, '''        executionCommand.setShellCommandShellEnvironment = true;
                  executionCommand.terminalTranscriptRows = mProperties.getTerminalTranscriptRows();''', '''        executionCommand.setShellCommandShellEnvironment = true;
                  int transcriptRows = mProperties.getTerminalTranscriptRows();
                  if (isTelevisionDevice()) {
                      TermuxAppSharedPreferences tvPreferences = TermuxAppSharedPreferences.build(this, false);
                      if (tvPreferences != null) {
                          String profile = tvPreferences.getTvMemoryProfile();
                          if ("low".equals(profile)) transcriptRows = 500;
                          else if ("balanced".equals(profile)) transcriptRows = 1500;
                          else if ("history".equals(profile)) transcriptRows = 5000;
                          // "system" preserves terminal-transcript-rows from termux.properties.
                      }
                  }
                  executionCommand.terminalTranscriptRows = transcriptRows;''')

          fragment = 'app/src/main/java/com/termux/app/fragments/settings/termux/TerminalViewPreferencesFragment.java'
          patch(fragment, '''import android.content.Context;
          import android.os.Bundle;''', '''import android.content.Context;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.os.Bundle;''')
          patch(fragment, '''import androidx.preference.PreferenceDataStore;
          import androidx.preference.PreferenceFragmentCompat;''', '''import androidx.preference.PreferenceCategory;
          import androidx.preference.PreferenceDataStore;
          import androidx.preference.PreferenceFragmentCompat;''')
          patch(fragment, '''        setPreferencesFromResource(R.xml.termux_terminal_view_preferences, rootKey);''', '''        setPreferencesFromResource(R.xml.termux_terminal_view_preferences, rootKey);
                  PreferenceCategory tvPerformance = findPreference("tv_performance");
                  if (tvPerformance != null) {
                      int type = context.getResources().getConfiguration().uiMode & Configuration.UI_MODE_TYPE_MASK;
                      boolean tv = type == Configuration.UI_MODE_TYPE_TELEVISION ||
                          context.getPackageManager().hasSystemFeature(PackageManager.FEATURE_LEANBACK);
                      tvPerformance.setVisible(tv);
                  }''')
          patch(fragment, '''    @Override
              public boolean getBoolean(String key, boolean defValue) {
                  if (mPreferences == null) return false;

                  switch (key) {
                      case "terminal_margin_adjustment":
                          return mPreferences.isTerminalMarginAdjustmentEnabled();
                      default:
                          return false;
                  }
              }

          }''', '''    @Override
              public boolean getBoolean(String key, boolean defValue) {
                  if (mPreferences == null) return defValue;
                  if ("terminal_margin_adjustment".equals(key))
                      return mPreferences.isTerminalMarginAdjustmentEnabled();
                  return defValue;
              }

              @Override
              public void putString(String key, String value) {
                  if (mPreferences != null && "tv_memory_profile".equals(key))
                      mPreferences.setTvMemoryProfile(value);
              }

              @Override
              public String getString(String key, String defValue) {
                  if (mPreferences != null && "tv_memory_profile".equals(key))
                      return mPreferences.getTvMemoryProfile();
                  return defValue;
              }

          }''')
          patch('app/src/main/res/xml/termux_terminal_view_preferences.xml', '''    </PreferenceCategory>

          </PreferenceScreen>''', '''    </PreferenceCategory>

              <PreferenceCategory
                  app:key="tv_performance"
                  app:title="@string/tv_performance_category">
                  <ListPreference
                      app:key="tv_memory_profile"
                      app:defaultValue="balanced"
                      app:entries="@array/tv_memory_profile_entries"
                      app:entryValues="@array/tv_memory_profile_values"
                      app:title="@string/tv_memory_profile_title"
                      app:summary="@string/tv_memory_profile_summary"
                      app:useSimpleSummaryProvider="true" />
              </PreferenceCategory>

          </PreferenceScreen>''')

          # English fallback resources; locale-specific resources below override these on Chinese systems.
          patch('app/src/main/res/values/strings.xml', '''</resources>''', '''    <string name="tv_shortcuts_button">TV shortcuts</string>
              <string name="tv_shortcuts_title">TV remote and keyboard shortcuts</string>
              <string name="tv_shortcuts_message">Remote: Up/Down scrolls terminal history; Select opens the keyboard; Menu toggles the session drawer. Keyboard: Ctrl+Alt+N/P switches sessions; Ctrl+Alt+C creates a session; Ctrl+Alt+K toggles the keyboard; Ctrl+Alt+V pastes; Ctrl+Alt+Plus/Minus changes font size; Ctrl+Alt+1–9 switches sessions.</string>
              <string name="tv_performance_category">TV performance</string>
              <string name="tv_memory_profile_title">Terminal history memory</string>
              <string name="tv_memory_profile_summary">Applies to new sessions. Less history usually uses less memory.</string>
          </resources>''')

          create('app/src/main/res/values/tv_preferences.xml', '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="tv_memory_profile_entries">
                  <item>Low memory (500 lines)</item>
                  <item>Balanced (1,500 lines)</item>
                  <item>Long history (5,000 lines)</item>
                  <item>Use termux.properties</item>
              </string-array>
              <string-array name="tv_memory_profile_values">
                  <item>low</item><item>balanced</item><item>history</item><item>system</item>
              </string-array>
          </resources>
          ''')
          create('app/src/main/res/values-zh-rCN/strings.xml', '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="action_new_session">新建会话</string>
              <string name="action_new_session_failsafe">安全模式</string>
              <string name="action_toggle_soft_keyboard">键盘</string>
              <string name="action_open_settings">设置</string>
              <string name="action_open_help">帮助</string>
              <string name="action_reset_terminal">重置终端</string>
              <string name="action_kill_process">结束进程 (%1$d)</string>
              <string name="action_style_terminal">终端外观</string>
              <string name="action_toggle_keep_screen_on">保持屏幕常亮</string>
              <string name="action_report_issue">报告问题</string>
              <string name="msg_enabling_terminal_toolbar">正在启用终端工具栏</string>
              <string name="msg_disabling_terminal_toolbar">正在关闭终端工具栏</string>
              <string name="title_activity_termux_settings">Termux 设置</string>
              <string name="termux_preferences_title">Termux</string>
              <string name="termux_preferences_summary">Termux 应用设置</string>
              <string name="termux_debugging_preferences_title">调试</string>
              <string name="termux_debugging_preferences_summary">调试相关选项</string>
              <string name="termux_logging_header">日志</string>
              <string name="termux_log_level_title">日志级别</string>
              <string name="termux_terminal_view_key_logging_enabled_title">终端按键日志</string>
              <string name="termux_terminal_view_key_logging_enabled_off">不记录终端按键日志（默认）</string>
              <string name="termux_terminal_view_key_logging_enabled_on">记录详细按键日志；可能影响性能，通常应关闭</string>
              <string name="termux_plugin_error_notifications_enabled_title">插件错误通知</string>
              <string name="termux_plugin_error_notifications_enabled_off">关闭插件错误提示和通知</string>
              <string name="termux_plugin_error_notifications_enabled_on">显示插件错误提示和通知（默认）</string>
              <string name="termux_crash_report_notifications_enabled_title">崩溃报告通知</string>
              <string name="termux_crash_report_notifications_enabled_off">关闭崩溃报告通知</string>
              <string name="termux_crash_report_notifications_enabled_on">显示崩溃报告通知（默认）</string>
              <string name="termux_terminal_io_preferences_title">终端输入/输出</string>
              <string name="termux_terminal_io_preferences_summary">键盘及终端输入设置</string>
              <string name="termux_keyboard_header">键盘</string>
              <string name="termux_soft_keyboard_enabled_title">启用屏幕键盘</string>
              <string name="termux_soft_keyboard_enabled_off">关闭屏幕键盘</string>
              <string name="termux_soft_keyboard_enabled_on">启用屏幕键盘（默认）</string>
              <string name="termux_soft_keyboard_enabled_only_if_no_hardware_title">仅在没有硬件键盘时显示</string>
              <string name="termux_soft_keyboard_enabled_only_if_no_hardware_off">连接硬件键盘时仍允许屏幕键盘（默认）</string>
              <string name="termux_soft_keyboard_enabled_only_if_no_hardware_on">仅在未连接硬件键盘时允许屏幕键盘</string>
              <string name="termux_terminal_view_preferences_title">终端显示</string>
              <string name="termux_terminal_view_preferences_summary">终端显示与历史记录设置</string>
              <string name="termux_terminal_view_view_header">显示</string>
              <string name="termux_terminal_view_terminal_margin_adjustment_title">自动调整终端边距</string>
              <string name="termux_terminal_view_terminal_margin_adjustment_off">关闭终端边距调整</string>
              <string name="termux_terminal_view_terminal_margin_adjustment_on">避免屏幕键盘遮挡终端底部；如出现闪烁可关闭（默认）</string>
              <string name="tv_shortcuts_button">电视快捷键</string>
              <string name="tv_shortcuts_title">电视遥控器与键盘快捷键</string>
              <string name="tv_shortcuts_message">遥控器：上/下方向键滚动终端历史；确认键打开屏幕键盘；菜单键打开或关闭会话侧栏。键盘：Ctrl+Alt+N/P 切换会话；Ctrl+Alt+C 新建会话；Ctrl+Alt+K 切换屏幕键盘；Ctrl+Alt+V 粘贴；Ctrl+Alt+加号/减号调整字号；Ctrl+Alt+1–9 切换会话。</string>
              <string name="tv_performance_category">电视性能</string>
              <string name="tv_memory_profile_title">终端历史记录内存</string>
              <string name="tv_memory_profile_summary">仅影响新建会话。保留的历史记录越少，占用的内存通常越少。</string>
          </resources>
          ''')
          create('app/src/main/res/values-zh-rCN/tv_preferences.xml', '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="tv_memory_profile_entries">
                  <item>低内存（500 行）</item>
                  <item>均衡（1500 行）</item>
                  <item>长历史（5000 行）</item>
                  <item>使用 termux.properties</item>
              </string-array>
              <string-array name="tv_memory_profile_values">
                  <item>low</item><item>balanced</item><item>history</item><item>system</item>
              </string-array>
          </resources>
          ''')
          create('termux-shared/src/main/res/values-zh-rCN/strings.xml', '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="action_yes">是</string>
              <string name="action_no">否</string>
              <string name="action_copy">复制</string>
              <string name="action_share">分享</string>
              <string name="action_cancel">取消</string>
              <string name="action_save_to_file">保存到文件</string>
              <string name="log_level_title">日志级别</string>
              <string name="log_level_off">关闭</string>
              <string name="log_level_normal">普通</string>
              <string name="log_level_debug">调试</string>
              <string name="log_level_verbose">详细</string>
              <string name="log_level_unknown">未知</string>
              <string name="log_level_value">日志级别已设为“%1$s”</string>
          </resources>
          ''')

          for path in (
              'app/src/main/res/values/tv_preferences.xml',
              'app/src/main/res/values-zh-rCN/strings.xml',
              'app/src/main/res/values-zh-rCN/tv_preferences.xml',
              'termux-shared/src/main/res/values-zh-rCN/strings.xml',
              'app/src/main/res/xml/termux_terminal_view_preferences.xml',
              'app/src/main/res/layout/activity_termux.xml',
          ):
              ET.parse(path)
              print('xml ok:', path)
          PY
          git diff --check

      - name: Run unit tests and build debug APKs
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: termux-tv-fix-v2-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publish fix branch and create pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH='tv/fix-v2-scroll-memory-zh'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add terminal-view/src/main/java/com/termux/view/TerminalView.java \
            app/src/main/java/com/termux/app/terminal/TermuxTerminalViewClient.java \
            app/src/main/java/com/termux/app/TermuxActivity.java \
            app/src/main/res/layout/activity_termux.xml \
            termux-shared/src/main/java/com/termux/shared/termux/settings/preferences/TermuxPreferenceConstants.java \
            termux-shared/src/main/java/com/termux/shared/termux/settings/preferences/TermuxAppSharedPreferences.java \
            app/src/main/java/com/termux/app/TermuxService.java \
            app/src/main/java/com/termux/app/fragments/settings/termux/TerminalViewPreferencesFragment.java \
            app/src/main/res/xml/termux_terminal_view_preferences.xml \
            app/src/main/res/values/strings.xml \
            app/src/main/res/values/tv_preferences.xml \
            app/src/main/res/values-zh-rCN/strings.xml \
            app/src/main/res/values-zh-rCN/tv_preferences.xml \
            termux-shared/src/main/res/values-zh-rCN/strings.xml
          git commit -m 'Fix TV terminal scrolling and tune memory settings'
          git push --force origin "$BRANCH"
          gh pr view "$BRANCH" --json number >/dev/null 2>&1 || \
            gh pr create --base master --head "$BRANCH" \
              --title 'Fix TV terminal scrolling, memory profile, and Chinese settings' \
              --body 'Builds on the first-round working Hisense keyboard fix. Adds D-pad scrollback, a TV-only scrollback memory profile, TV shortcut help, and Simplified Chinese settings resources.'
